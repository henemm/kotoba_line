name: CI

# Branches are checked through their pull request; main is checked on push.
# Listening to both for every branch runs each job twice for no extra signal.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: Test
        run: npm test

  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      # The import scripts have no dependencies of their own; they borrow
      # better-sqlite3 from the server, which is why this installs there.
      - run: npm ci
        working-directory: server

      # Runs against a synthetic .apkg built in the test, so CI never
      # downloads the 110 MB deck.
      - run: npm run test:import

      # The client has no dependencies at all; only its pure logic is tested
      # here, the screens are checked by looking at them.
      - run: npm run test:client

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The image compiles better-sqlite3 against musl. A build that only ever
      # succeeds on a workstation is a deploy-day surprise.
      - name: Build the container image
        run: docker build -f ops/Dockerfile -t kotoba-line-server .

      - name: Start it and check health
        run: |
          docker run -d --name kotoba -p 127.0.0.1:8080:8080 \
            -e COOKIE_SECURE=false kotoba-line-server
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health; then
              echo; echo "healthy"; exit 0
            fi
            sleep 1
          done
          echo "did not become healthy"; docker logs kotoba; exit 1

      - name: Stop
        if: always()
        run: docker rm -f kotoba || true

  shell-version:
    # A shell change that keeps the old VERSION never reaches a device that
    # already installed the app: the precache is keyed by that name, so the
    # phone goes on serving what it already has. Two branches picking the same
    # next number merge without a conflict and produce exactly that — which is
    # how "v8" came to mean two different shells here.
    #
    # This compares the merge result against the base branch, so it catches the
    # collision that only exists once merged. It cannot catch a base branch
    # that moves after the last run; requiring branches to be up to date before
    # merging would close that gap.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The shell's VERSION must move when the shell does
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch -q origin "${{ github.base_ref }}"

          if git diff --quiet "$base"...HEAD -- client/; then
            echo "client/ is unchanged; nothing to check."
            exit 0
          fi

          version_of() { git show "$1:client/sw.js" | sed -n 's/^const VERSION = "\(.*\)";$/\1/p'; }
          here=$(version_of HEAD)
          there=$(version_of "$base")
          echo "VERSION here: ${here:-?}, on $base: ${there:-?}"

          if [ -z "$here" ] || [ "$here" = "$there" ]; then
            echo
            echo "client/ changed but sw.js VERSION is still '$here'."
            echo "Every device that already installed '$here' keeps serving the"
            echo "old shell and never sees this change. Bump VERSION."
            exit 1
          fi
