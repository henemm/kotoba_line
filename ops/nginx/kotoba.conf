# ことばライン — nginx configuration. Mirrors §9 of docs/kotoba-line-spec.md.
#
# Everything sits under the single prefix /kotoba/ so the service worker scope,
# the manifest scope and the session cookie path stay aligned. Getting those
# three out of step is the usual reason a path-hosted PWA silently fails to
# install on iOS.
#
# Install: copy the limit_req_zone into the http block, the location blocks
# into the existing TLS server block for the host.

# ── http block ───────────────────────────────────────────────────────
# §10: five login attempts per minute per address. This has to reject before
# the request costs the API an argon2 verification, which is why it lives here
# and not in the application.
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

# ── server block ─────────────────────────────────────────────────────

location /kotoba/api/auth/login {
    limit_req zone=login burst=3 nodelay;
    # 429 rather than nginx's default 503: the client shows a countdown for
    # "too many attempts" (design screen 01, rate-limited state) and needs to
    # tell that apart from the server being down.
    limit_req_status 429;

    proxy_pass http://127.0.0.1:8080/api/auth/login;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /kotoba/api/ {
    proxy_pass http://127.0.0.1:8080/api/;   # trailing slash strips the prefix
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /kotoba/media/ {
    alias /srv/kotoba/media/;
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

location /kotoba/ {
    alias /srv/kotoba/app/;
    try_files $uri $uri/ /kotoba/index.html;
    # The shell revalidates; the SW caches. The update check (#93) revalidates
    # sw.js on its own (updateViaCache defaults to "imports") and the install
    # fetches with cache: "reload", so this is not what finds a new version —
    # but a long `expires` here would still serve stale files to any page the
    # worker does not control yet, so keep it.
    add_header Cache-Control "no-cache";
}

# The service worker must be served from /kotoba/sw.js so its scope is
# /kotoba/. A worker served from the domain root cannot control a subpath app
# reliably, and the failure is silent. The location above already covers it;
# this is a note, not a second block.

# ── on deployment ────────────────────────────────────────────────────
#
# `alias` combined with `try_files` is a known source of confusing 404s. If it
# misbehaves, move the app into a kotoba subdirectory and use `root /srv/kotoba;`
# instead. Verify a deep link such as /kotoba/stats reloads correctly before
# moving on.
#
# TLS via Let's Encrypt, HTTP redirected to HTTPS. Service workers and the
# speech APIs both refuse to run otherwise.
