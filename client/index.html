<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover so the home indicator inset is ours to respect -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#141824">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ことばライン">
<title>ことばライン</title>

<script>
  // Light or dark before anything is drawn (#137, v65). The setting lives on
  // the server; this device keeps a copy (`keepSettings` in app.js), read
  // here synchronously so a light app never starts dark for a frame. Light
  // when there is no copy: it is the default.
  //
  // The status bar is the one part iOS reads from the page as it launches.
  // "black-translucent" draws white clock and battery over the page, which
  // on a light page cannot be read, so light asks for "default" instead —
  // dark text on a light bar, with the page starting below it. Changing the
  // setting takes effect there on the next start of the app.
  (function () {
    var appearance = "light";
    try {
      appearance = localStorage.getItem("appearance") || "light";
    } catch (e) {}
    var dark = appearance === "dark" ||
      (appearance === "system" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-appearance", appearance);
    document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').setAttribute("content", dark ? "black-translucent" : "default");
    document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#141824" : "#F3F4F7");
  })();
</script>

<link rel="manifest" href="./manifest.webmanifest">
<!-- iOS ignores manifest icons for the home screen (§7). -->
<link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon-180.png">

<link rel="stylesheet" href="./src/ui/tokens.css">
<link rel="stylesheet" href="./src/ui/base.css">
<link rel="stylesheet" href="./src/ui/screens.css">
</head>
<body>
<div id="app"></div>
<script type="module" src="./src/app.js"></script>
</body>
</html>
