document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

order-radius:14px;background:#3DDC84;display:grid;place-items:center;font-size:15px;font-weight:700;color:#0D1017\">Easy<\u002Fspan>\n            <span style=\"font:400 11px/1 ui-monospace,Menlo,monospace;color:#8A93A8\">6d<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:0;padding-top:10px;border-top:1px solid #2A3244;font:400 12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:#8A93A8\">Frame cropped to the revealed card. Four equal targets, 62pt tall, with the interval FSRS would give printed underneath — that number is why four buttons are worth the extra width. Weight runs one way: red tint, plain, green tint, solid green, so the row reads left to right as \"worse to better\" without a legend. Intervals come from the scheduler and can be \"10m\" or \"3mo\"; the label is centred and the button never resizes.<\u002Fp>\n\n      <div style=\"font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:#8A93A8;margin-top:20px\">42 The two-button case · 話す, for comparison<\u002Fdiv>\n      <div style=\"width:390px;height:300px;background:#141824;border-radius:20px;border:1px solid #2A3244;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:0 24px 60px rgba(0,0,0,.5)\">\n        <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px 24px 0;text-align:center\">\n          <span style=\"font-family:'Hiragino Sans','Noto Sans JP','Yu Gothic','MS PGothic',sans-serif;font-size:26px;font-weight:700;line-height:1.5\">大丈夫、心配しないで。<\u002Fspan>\n          <span style=\"font-size:14px;color:#8A93A8\">It's fine, don't worry.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"flex:none;padding:20px;display:flex;gap:10px\">\n          <span style=\"flex:1;height:62px;border-radius:14px;background:rgba(255,75,75,.16);display:grid;place-items:center;font-size:16px;font-weight:700;color:#FF4B4B\">Missed it<\u002Fspan>\n          <span style=\"flex:1;height:62px;border-radius:14px;background:rgba(61,220,132,.16);display:grid;place-items:center;font-size:16px;font-weight:700;color:#3DDC84\">Had it<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:0;padding-top:10px;border-top:1px solid #2A3244;font:400 12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:#8A93A8\">Same height, same tints, half the count and no interval labels — 話す asks whether she could produce it, which is a yes-or-no question. 選ぶ and 聞く show no grading row at all; the tapped option is the grade. Only めくる gets four.<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- speak states -->\n    <div style=\"display:flex;flex-direction:column;gap:12px;width:390px\">\n      <div style=\"font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:#8A93A8\">43 話す · listening<\u002Fdiv>\n      <div style=\"width:390px;height:470px;background:#141824;border-radius:20px;border:1px solid #2A3244;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.5)\">\n        <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:26px;text-align:center\">\n          <span style=\"font-size:13px;color:#8A93A8\">Say it in Japanese<\u002Fspan>\n          <span style=\"font-size:24px;font-weight:600;line-height:1.35\">Excuse me, do you have a second?<\u002Fspan>\n          <div style=\"display:flex;align-items:flex-end;gap:5px;height:34px\">\n            <span style=\"width:5px;height:12px;border-radius:3px;background:#C7008B;display:block\"><\u002Fspan>\n            <span style=\"width:5px;height:26px;border-radius:3px;background:#C7008B;display:block\"><\u002Fspan>\n            <span style=\"width:5px;height:34px;border-radius:3px;background:#C7008B;display:block\"><\u002Fspan>\n            <span style=\"width:5px;height:19px;border-radius:3px;background:#C7008B;display:block\"><\u002Fspan>\n            <span style=\"width:5px;height:29px;border-radius:3px;background:#C7008B;display:block\"><\u002Fspan>\n            <span style=\"width:5px;height:9px;border-radius:3px;background:#C7008B;display:block\"><\u002Fspan>\n          <\u002Fdiv>\n          <span style=\"font:400 12px/1 ui-monospace,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase;color:#8A93A8\">Listening<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"flex:none;padding:0 20px 24px;display:flex;gap:10px\">\n          <span style=\"flex:1;height:58px;border-radius:14px;background:#2A3244;display:grid;place-items:center;font-size:16px;font-weight:700\">Stop<\u002Fspan>\n          <span style=\"flex:1;height:58px;border-radius:14px;background:#C7008B;color:#fff;display:grid;place-items:center;font-size:16px;font-weight:700\">Show answer<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:0;padding-top:10px;border-top:1px solid #2A3244;font:400 12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:#8A93A8\">Frames 43–46 cropped to the card area. Six bars in the mode colour, the only animated element in the app besides level-up; they move with input level and freeze at rest. Show answer stays available throughout — she can always skip straight to grading herself.<\u002Fp>\n\n      <div style=\"font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:#8A93A8;margin-top:20px\">44 話す · recognition returned<\u002Fdiv>\n      <div style=\"width:390px;height:470px;background:#141824;border-radius:20px;border:1px solid #2A3244;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.5)\">\n        <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:26px;text-align:center\">\n          <span style=\"font-size:13px;color:#8A93A8\">Say it in Japanese<\u002Fspan>\n          <span style=\"font-size:20px;font-weight:600;line-height:1.35;color:#8A93A8\">Excuse me, do you have a second?<\u002Fspan>\n          <div style=\"width:100%;background:#1E2433;border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:8px\">\n            <span style=\"font:400 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;color:#8A93A8\">Heard<\u002Fspan>\n            <span style=\"font-family:'Hiragino Sans','Noto Sans JP','Yu Gothic','MS PGothic',sans-serif;font-size:24px;font-weight:700;line-height:1.4\">すみません、ちょっといいですか<\u002Fspan>\n          <\u002Fdiv>\n          <span style=\"font-size:13px;line-height:1.5;color:#8A93A8;text-wrap:pretty\">What the phone heard, not a mark. You decide whether you had it.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"flex:none;padding:0 20px 24px;display:flex;gap:10px\">\n          <span style=\"flex:1;height:58px;border-radius:14px;background:#2A3244;display:grid;place-items:center;font-size:16px;font-weight:700\">Again<\u002Fspan>\n          <span style=\"flex:1;height:58px;border-radius:14px;background:#C7008B;color:#fff;display:grid;place-items:center;font-size:16px;font-weight:700\">Show answer<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:0;padding-top:10px;border-top:1px solid #2A3244;font:400 12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:#8A93A8\">Recognition is quoted, never scored: no tick, no colour, no yes/no. The sentence under it exists because a transcript on a practice screen looks like a verdict unless something says otherwise. Recognition returning nothing at all shows the same box with \"— nothing heard —\" in muted type; the two buttons are unchanged, so a failed attempt costs one tap.<\u002Fp>\n\n      <div style=\"font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:#8A93A8;margin-top:20px\">45 話す · microphone refused<\u002Fdiv>\n      <div style=\"width:390px;height:430px;background:#141824;border-radius:20px;border:1px solid #2A3244;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.5)\">\n        <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:26px;text-align:center\">\n          <span style=\"font-size:13px;color:#8A93A8\">Say it in Japanese<\u002Fspan>\n          <span style=\"font-size:24px;font-weight:600;line-height:1.35\">Excuse me, do you have a second?<\u002Fspan>\n          <span style=\"font-size:14px;line-height:1.55;color:#8A93A8;text-wrap:pretty\">The microphone is off, so say it out loud and grade yourself. You can turn it on in iOS Settings.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"flex:none;padding:0 20px 24px\">\n          <span style=\"display:grid;place-items:center;height:58px;border-radius:14px;background:#C7008B;color:#fff;font-size:16px;font-weight:700\">Show answer<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:0;padding-top:10px;border-top:1px solid #2A3244;font:400 12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:#8A93A8\">Not an error: the mode works without a microphone, so the record button simply is not there and the sentence says what to do instead. Shown once per session, not once per card. No link into Settings — iOS cannot deep-link there reliably, and a dead link is worse than a sentence.<\u002Fp>\n\n      <div style=\"font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:#8A93A8;margin-top:20px\">46 話す · recognition unavailable<\u002Fdiv>\n      <div style=\"width:390px;height:430px;background:#141824;border-radius:20px;border:1px solid #2A3244;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.5)\">\n        <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:26px;text-align:center\">\n          <span style=\"font-size:13px;color:#8A93A8\">Say it in Japanese<\u002Fspan>\n          <span style=\"font-size:24px;font-weight:600;line-height:1.35\">Excuse me, do you have a second?<\u002Fspan>\n          <span style=\"font-size:14px;line-height:1.55;color:#8A93A8;text-wrap:pretty\">This device can't listen. Say it out loud anyway — the mode works the same, you just grade yourself unaided.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"flex:none;padding:0 20px 24px\">\n          <span style=\"display:grid;place-items:center;height:58px;border-radius:14px;background:#C7008B;color:#fff;font-size:16px;font-weight:700\">Show answer<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:0;padding-top:10px;border-top:1px solid #2A3244;font:400 12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:#8A93A8\">Identical layout to 45 with different copy, because from her side the situation is identical — the distinction between \"refused\" and \"unsupported\" matters to the developer, not to her. Feature-detected at session start; standalone mode on iOS lands here often, which is why it must not look broken.<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- audio missing + first run -->\n    <div style=\"display:flex;flex-direction:column;gap:12px;width:390px\">\n      <div style=\"font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:#8A93A8\">47 聞く · no recording for this card<\u002Fdiv>\n      <div style=\"width:390px;height:470px;background:#141824;border-radius:20px;border:1px solid #2A3244;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.5)\">\n        <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:26px;text-align:center\">\n          <span style=\"font-size:13px;color:#8A93A8\">Listen — no text<\u002Fspan>\n          <span style=\"width:108px;height:108px;border-radius:50%;background:#00A7DB;display:grid;place-items:center;font-size:44px;color:#fff\">♪<\u002Fspan>\n          <span style=\"font:400 12px/1.5 ui-monospace,Menlo,monospace;color:#8A93A8;max-width:260px\">No recording for this card — read by the phone's Japanese voice<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"flex:none;padding:0 20px 24px;display:grid;gap:10px\">\n          <span style=\"padding:16px 18px;border-radius:14px;background:#1E2433;font-size:16px;font-weight:600\">Excuse me, do you have a second?<\u002Fspan>\n          <span style=\"padding:16px 18px;border-radius:14px;background:#1E2433;font-size:16px;font-weight:600\">Where is the station?<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:0;padding-top:10px;border-top:1px solid #2A3244;font:400 12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:#8A93A8\">Frames 47–48 cropped. Synthesis is the fallback and the caption says so, because a synthetic voice she mistakes for a recording teaches her the wrong pronunciation. Her own cards always land here. If synthesis is unavailable too — silent switch aside, it is a real failure mode on iOS — the card is dropped from the queue before it is shown and the strip loses a station; she never meets a prompt she cannot hear.<\u002Fp>\n\n      <div style=\"font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:#8A93A8;margin-top:20px\">48 選ぶ · same card, sound absent<\u002Fdiv>\n      <div style=\"width:390px;height:400px;background:#141824;border-radius:20px;border:1px solid #2A3244;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.5)\">\n        <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:26px;text-align:center\">\n          <span style=\"font-size:13px;color:#8A93A8\">What does this mean?<\u002Fspan>\n          <span style=\"font-family:'Hiragino Sans','Noto Sans JP','Yu Gothic','MS PGothic',sans-serif;font-size:64px;font-weight:800;line-height:1.15\">袋<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"flex:none;padding:0 20px 24px;display:grid;gap:10px\">\n          <span style=\"padding:16px 18px;border-radius:14px;background:#1E2433;font-size:16px;font-weight:600\">bag<\u002Fspan>\n          <span style=\"padding:16px 18px;border-radius:14px;background:#1E2433;font-size:16px;font-weight:600\">receipt<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:0;padding-top:10px;border-top:1px solid #2A3244;font:400 12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:#8A93A8\">The speaker is simply gone; nothing else shifts, because the card area is centred and the button was never load-bearing. No disabled control and no explanation — in 選ぶ the sound is a bonus, and an inert button would invite a tap that does nothing.<\u002Fp>\n\n      <div style=\"font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:#8A93A8;margin-top:20px\">49 First run · the deck download<\u002Fdiv>\n      <div style=\"width:390px;height:844px;background:#141824;border-radius:34px;border:1px solid #2A3244;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.5)\">\n        <div style=\"height:46px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:13px;font-weight:600\">\n          <span>9:41<\u002Fspan><span style=\"width:22px;height:11px;border:1px solid #8A93A8;border-radius:3px;display:block\"><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 30px;gap:30px\">\n          <h2 style=\"margin:0;font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic','MS PGothic',sans-serif;font-size:42px;font-weight:800;letter-spacing:.03em;line-height:1.1\">ことばライン<\u002Fh2>\n          <div style=\"display:flex;flex-direction:column;gap:14px\">\n            <span style=\"font-size:20px;font-weight:700\">Getting the deck<\u002Fspan>\n            <div style=\"display:flex;gap:4px\">\n              <span style=\"flex:1;height:7px;border-radius:4px;background:#F2F4F8\"><\u002Fspan>\n              <span style=\"flex:1;height:7px;border-radius:4px;background:#F2F4F8\"><\u002Fspan>\n              <span style=\"flex:1;height:7px;border-radius:4px;background:#F2F4F8\"><\u002Fspan>\n              <span style=\"flex:1;height:7px;border-radius:4px;background:#F2F4F8\"><\u002Fspan>\n              <span style=\"flex:1;height:7px;border-radius:4px;background:#F2F4F8\"><\u002Fspan>\n              <span style=\"flex:1;height:7px;border-radius:4px;background:#F2F4F8\"><\u002Fspan>\n              <span style=\"flex:1;height:7px;border-radius:4px;background:#F2F4F8\"><\u002Fspan>\n              <span style=\"flex:1;height:7px;border-radius:4px;background:#2A3244\"><\u002Fspan>\n              <span style=\"flex:1;height:7px;border-radius:4px;background:#2A3244\"><\u002Fspan>\n              <span style=\"flex:1;height:7px;border-radius:4px;background:#2A3244\"><\u002Fspan>\n              <span style=\"flex:1;height:7px;border-radius:4px;background:#2A3244\"><\u002Fspan>\n              <span style=\"flex:1;height:7px;border-radius:4px;background:#2A3244\"><\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;font:400 12px/1 ui-monospace,Menlo,monospace;color:#8A93A8\">\n              <span>870 of 1,482 cards<\u002Fspan>\n              <span>1.2 of 2.1 MB<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#1E2433;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px\">\n            <span style=\"font-size:15px;font-weight:600\">Text only, once<\u002Fspan>\n            <p style=\"margin:0;font-size:14px;line-height:1.55;color:#8A93A8;text-wrap:pretty\">Audio is never downloaded in bulk. Each recording is kept the first time you hear it, so the app stays small on mobile data.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:none;padding:0 30px 30px;display:flex;flex-direction:column;gap:12px\">\n          <p style=\"margin:0;font-size:13px;line-height:1.5;color:#8A93A8\">You can start practising as soon as the first cards arrive.<\u002Fp>\n          <button style=\"width:100%;height:56px;border:2px solid #2A3244;border-radius:14px;background:none;color:#F2F4F8;font:600 16px/1 inherit;cursor:pointer\">Pause until Wi-Fi<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:0;padding-top:10px;border-top:1px solid #2A3244;font:400 12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:#8A93A8\">The first thing she ever sees after signing in, so it states the size before it states the progress, and offers the way out for a metered connection. Progress uses the station strip at twelve segments regardless of card count. Resuming after a pause continues from the last received card; a failed download shows the same screen with \"Stopped at 870 — tap to carry on\" and the button becomes Retry.<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- leaving, resuming, expired -->\n    <div style=\"display:flex;flex-direction:column;gap:12px;width:390px\">\n      <div style=\"font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:#8A93A8\">50 Leaving a session<\u002Fdiv>\n      <div style=\"width:390px;height:470px;background:#141824;border-radius:20px;border:1px solid #2A3244;overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 24px 60px rgba(0,0,0,.5)\">\n        <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:26px;opacity:.16;text-align:center\">\n          <span style=\"font-family:'Hiragino Sans','Noto Sans JP','Yu Gothic','MS PGothic',sans-serif;font-size:56px;font-weight:800\">大丈夫<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"position:absolute;inset:0;background:rgba(13,16,23,.78);display:flex;align-items:flex-end\">\n          <div style=\"width:100%;background:#1E2433;border-radius:24px 24px 20px 20px;padding:24px;display:flex;flex-direction:column;gap:18px\">\n            <div style=\"display:flex;flex-direction:column;gap:8px\">\n              <span style=\"font-size:20px;font-weight:700\">Leave this session?<\u002Fspan>\n              <span style=\"font-size:14px;line-height:1.55;color:#8A93A8\">The 4 cards you answered are already saved. The rest go back in the queue.<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:10px\">\n              <button style=\"flex:1;height:54px;border:0;border-radius:14px;background:#2A3244;color:#F2F4F8;font:700 16px/1 inherit;cursor:pointer\">Leave<\u002Fbutton>\n              <button style=\"flex:1;height:54px;border:0;border-radius:14px;background:#F2F4F8;color:#141824;font:700 16px/1 inherit;cursor:pointer\">Keep going<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:0;padding-top:10px;border-top:1px solid #2A3244;font:400 12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:#8A93A8\">Frame cropped. The × asks once, and the sentence answers the only real question — whether the work counts. Keep going is the primary because the tap that opened this was often a mistake. Before the first answer there is no sheet at all: leaving costs nothing, so it just leaves.<\u002Fp>\n\n      <div style=\"font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:#8A93A8;margin-top:20px\">51 Coming back · resume row<\u002Fdiv>\n      <div style=\"width:390px;height:470px;background:#141824;border-radius:34px 34px 20px 20px;border:1px solid #2A3244;overflow:hidden;display:flex;flex-dire unt doubles as the way into the list; at zero words the second line reads \"nothing in your own deck yet\".<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- add word empty -->\n    <div style=\"display:flex;flex-direction:column;gap:12px;width:390px\">\n      <div style=\"font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:#8A93A8\">28 Add a word · empty<\u002Fdiv>\n      <div style=\"width:390px;height:844px;background:#141824;border-radius:34px;border:1px solid #2A3244;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.5)\">\n        <div style=\"height:46px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:13px;font-weight:600\">\n          <span>9:41<\u002Fspan>\n          <span style=\"width:22px;height:11px;border:1px solid #8A93A8;border-radius:3px;display:block\"><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;justify-content:space-between;padding:8px 26px 20px\">\n          <span style=\"font-size:16px;font-weight:600;color:#8A93A8\">Cancel<\u002Fspan>\n          <span style=\"font-size:17px;font-weight:700\">Add a word<\u002Fspan>\n          <span style=\"font-size:16px;font-weight:700;color:#5E6884\">Save<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"flex:1;padding:0 26px;display:flex;flex-direction:column;gap:24px\">\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <span style=\"font:600 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:#8A93A8\">Word<\u002Fspan>\n            <div style=\"min-height:82px;background:#1E2433;border-radius:14px;display:flex;align-items:center;padding:0 18px\">\n              <span style=\"font-family:'Hiragino Sans','Noto Sans JP','Yu Gothic','MS PGothic',sans-serif;font-size:38px;font-weight:800;color:#8A93A8\">日本語<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\ box-shadow:0 -10px 40px rgba(13,16,23,.6)\">\n              <div style=\"display:flex;flex-direction:column;gap:8px\">\n                <span style=\"font-size:20px;font-weight:700;line-height:1.3;text-wrap:pretty\">Keep ことばライン on your home screen<\u002Fspan>\n                <span style=\"font-size:14px;line-height:1.5;color:#8A93A8\">It opens full screen and works without a connection.<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:10px\">\n                <div style=\"display:flex;align-items:center;gap:12px\">\n                  <span style=\"width:22px;height:22px;flex:none;border-radius:50%;background:#2A3244;display:grid;place-items:center;font:700 12px/1 ui-monospace,Menlo,monospace\">1<\u002Fspan>\n                  <span style=\"font-size:15px\">Tap Share, below<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:12px\">\n                  <span style=\"width:22px;height:22px;flex:none;border-radius:50%;background:#2A3244;display:grid;place-items:center;font:700 12px/1 ui-monospace,Menlo,monospace\">2<\u002Fspan>\n                  <span style=\"font-size:15px\">Choose Add to Home Screen<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:10px\">\n                <button style=\"flex:1;height:48px;border:0;border-radius:12px;background:#2A3244;color:#F2F4F8;font:600 15px/1 inherit;cursor:pointer\">Not now<\u002Fbutton>\n                <button style=\"flex:1;height:48px;border:0;border-radius:12px;background:none;color:#8A93A8;font:600 15px/1 inherit;cursor:pointer\">Don't show again<\u002Fbutton>\n              <\u002Fdiv>\n              <span style=\"position:absolute;left:50%;bottom:-9px;margin-left:-9px;width:18px;height:18px;background:#1E2433;transform:rotate(45deg);display:block\"><\u002Fspan>\n            <\u002Fdiv>\n\n            <div style=\"height:26px\"><\u002Fdiv>\n\n            <div style=\"height:58px;background:#1E2433;border-top:1px solid #2A3244;display:flex;align-items:center;justify-content:space-around;padding:0 22px\">\n              <span style=\"width:20px;height:20px;border-radius:4px;background:#3D465C;display:block\"><\u002Fspan>\n              <span style=\"width:20px;height:20px;border-radius:4px;background:#3D465C;display:block\"><\u002Fspan>\n              <span style=\"width:38px;height:38px;border-radius:50%;border:3px solid #F2F4F8;display:grid;place-items:center;box-sizing:border-box\"><span style=\"width:18px;height:18px;border-radius:4px;background:#F2F4F8;display:block\"><\u002Fspan><\u002Fspan>\n              <span style=\"width:20px;height:20px;border-radius:4px;background:#3D465C;display:block\"><\u002Fspan>\n              <span style=\"width:20px;height:20px;border-radius:4px;background:#3D465C;display:block\"><\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:0;padding-top:10px;border-top:1px solid #2A3244;font:400 12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:#8A93A8\">The grey bar is Safari's own toolbar, drawn here for position only — the app cannot render it. The sheet sits above it with a pointer at 50% width, which is where the Share control sits on iPhone; on iPad Safari the Share control is top-right, so the pointer flips to the top edge and the sheet anchors under the address bar. Show only when navigator.standalone is false and the browser is Safari; \"Don't show again\" writes a flag that is never re-asked.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:12px;width:390px;padding-top:32px\">\n        <div style=\"background:#141824;border:1px solid #2A3244;border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:18px\">\n          <span style=\"font:700 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:#8A93A8\">Display rules<\u002Fspan>\n          <div style=\"display:flex;flex-direction:column;gap:14px;font-size:14px;line-height:1.55;color:#F2F4F8\">\n            <p style=\"margin:0\">Shown at most once per install, on the second visit rather than the first — she should see the app work before being asked to keep it.<\u002Fp>\n            <p style=\"margin:0;color:#8A93A8\">Never shown in standalone mode, never in Chrome or Firefox on iOS (where Add to Home Screen does not exist), never while a session is running.<\u002Fp>\n            <p style=\"margin:0;color:#8A93A8\">Dismissal is permanent per device. There is no re-entry point; if she dismisses it and later wants the icon, the normal Safari flow still works.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ─────────────  7 · APP ICON  ───────────── -->\n  <div style=\"display:flex;flex-direction:column;gap:20px\">\n    <div style=\"display:flex;align-items:center;gap:14px\">\n      <span style=\"font:700 13px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em;color:#F2F4F8\">07 APP ICON<\u002Fspan>\n      <span style=\"flex:1;height:1px;background:#2A3244\"><\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-wrap:wrap;gap:44px;align-items:flex-start\">\n\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <div style=\"font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:#8A93A8\">icon-512.png · full bleed<\u002Fdiv>\n        <div style=\"width:200px;height:200px;overflow:hidden;position:relative;border-radius:44px;background:#141824\">\n          <div style=\"width:512px;height:512px;position:absolute;top:0;left:0;transform:scale(0.390625);transform-origin:top left;background:#141824\">\n            <span style=\"position:absolute;left:56px;top:236px;width:400px;height:40px;border-radius:20px;background:#F15A22;display:block\"><\u002Fspan>\n nsform:rotate(90deg)\"><\u002Fspan>\n            <span style=\"position:absolute;left:120px;top:246px;width:272px;height:28px;border-radius:14px;background:#C7008B;display:block;transform:rotate(45deg)\"><\u002Fspan>\n            <span style=\"position:absolute;left:120px;top:246px;width:272px;height:28px;border-radius:14px;background:#80C241;display:block;transform:rotate(-45deg)\"><\u002Fspan>\n            <span style=\"position:absolute;left:200px;top:200px;width:112px;height:112px;border-radius:50%;background:#141824;display:block\"><\u002Fspan>\n            <span style=\"position:absolute;left:222px;top:222px;width:68px;height:68px;border-radius:50%;background:#F2F4F8;display:block\"><\u002Fspan>\n            <span style=\"position:absolute;left:51px;top:51px;width:410px;height:410px;border-radius:50%;border:3px dashed #3D465C;box-sizing:border-box;display:block\"><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:0;padding-top:10px;border-top:1px solid #2A3244;font:400 12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:#8A93A8;max-width:200px\">Same mark at 66%, inside the 80% safe circle. Dashed guide does not ship.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <div style=\"font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:#8A93A8\">On the home screen · 60px and 40px<\u002Fdiv>\n        <div style=\"display:flex;align-items:flex-end;gap:24px;padding:26px 24px;background:#1E2433;border-radius:20px\">\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\">\n            <div style=\"width:60px;height:60px;overflow:hidden;position:relative;border-radius:14px;background:#141824\">\n              <div style=\"width:512px;height:512px;position:absolute;top:0;left:0;transform:scale(0.1171875);transform-origin:top left;background:#141824\">\n                <span style=\"posi y:block;transform:rotate(45deg)\"><\u002Fspan>\n                <span style=\"position:absolute;left:56px;top:236px;width:400px;height:40px;border-radius:20px;background:#80C241;display:block;transform:rotate(-45deg)\"><\u002Fspan>\n                <span style=\"position:absolute;left:176px;top:176px;width:160px;height:160px;border-radius:50%;background:#141824;display:block\"><\u002Fspan>\n                <span style=\"position:absolute;left:206px;top:206px;width:100px;height:100px;border-radius:50%;background:#F2F4F8;display:block\"><\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <span style=\"font-size:11px;color:#8A93A8\">40<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:0;padding-top:10px;border-top:1px solid #2A3244;font:400 12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:#8A93A8;max-width:280px\">Legibility check at the two sizes it actually appears in. Deliver icon-192, icon-512, maskable-512 and apple-touch-icon-180 (square, no transparency, no rounding — iOS masks it).<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fsection>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1600,&quot;height&quot;:1100}}\"><\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
